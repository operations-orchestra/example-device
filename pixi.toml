[workspace]
name = "operations-orchestra-example"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pytest = "*"
matplotlib-base = "*"
pip = "*"
pyyaml = "*"

[pypi-dependencies]
operations-orchestra-example = { path = ".", editable = true }

[tasks]
test = "pytest -q"
synth = "orchestra synth"

# The Orchestra components live in sibling repos of this one (../aggregator etc.).
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/../utils:$PIXI_PROJECT_ROOT/../aggregator:$PIXI_PROJECT_ROOT/../anonymizer:$PIXI_PROJECT_ROOT/../summarizer:$PIXI_PROJECT_ROOT/../sparsifier:$PIXI_PROJECT_ROOT/../orchestrator"
