<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Record browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Operations Record browser</div>
  <div class="synthetic" id="banner" title="">Synthetic, not CMS data · written directly by a generator</div>
  <div class="recfile"><button id="rec-btn" title="Load a different Record file">Record: <span id="rec-name"></span> &#9662;</button>
    <div id="rec-panel" class="rec-panel" hidden></div></div>
</header>
<section class="clock" id="replay-bar" aria-label="Replay controls" hidden></section>
<div class="layout">
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
