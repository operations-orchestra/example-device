# An example of the LLM profiles file for the agent's LLM brain (orchestrator/llm_config.py).
# Copy it to config/llm.yaml (ignored by git) and put your own endpoints there. No keys in
# either file: each profile names the variable that holds its key, set in the environment or
# in ~/.config/orchestra/keys.env (chmod 600).
default: local
profiles:
  local:                       # a model served on this machine (for example by Ollama): no key
    backend: openai_compatible
    options: {base_url: "http://127.0.0.1:11434/v1", model: gemma3:12b}
  gateway:                     # a hosted, OpenAI-compatible gateway
    backend: openai_compatible
    options: {base_url: "https://llm-gateway.example.org/v1", model: some-model, api_key_env: GATEWAY_API_KEY}
