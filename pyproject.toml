[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-orchestra-example"
version = "0.1.0"
description = "Prototype of the Operations Orchestra on a synthetic HCAL-like example device"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
orchestra = "orchestra_cli:main"

[tool.setuptools]
py-modules = ["orchestra_cli"]
packages = ["utils", "aggregator", "example_device", "viewer", "adapters", "anonymizer", "summarizer", "sparsifier", "orchestrator"]

[tool.setuptools.package-data]
aggregator = ["schema.sql"]
viewer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
